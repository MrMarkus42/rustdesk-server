name: Build and publish to ghcr.io

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: 'API image the s6 image builds on (e.g. ghcr.io/mrmarkus42/rustdesk-api:v2.7.4-rc1)'
        required: false
        default: 'ghcr.io/mrmarkus42/rustdesk-api:latest'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always
  LATEST_TAG: latest
  # GHCR needs lowercase names; github.repository keeps the owner's case (MrMarkus42)
  IMAGE_REPO: ghcr.io/mrmarkus42/rustdesk-server
  API_IMAGE: ${{ github.event.inputs.api_image || 'ghcr.io/mrmarkus42/rustdesk-api:latest' }}

permissions:
  contents: read
  packages: write # So need to set "secrets.GITHUB_TOKEN"

jobs:

  # Binary build
  build:
    name: Build - ${{ matrix.job.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386",    target: "i686-unknown-linux-musl" }
          #- { name: "amd64fb", target: "x86_64-unknown-freebsd" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
    
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}
          components: "rustfmt"
          
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.target }} # per target: cross images differ in glibc, build scripts must not be shared

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}
          use-cross: true  

      - name: Exec chmod
        run: chmod -v a+x target/${{ matrix.job.target }}/release/*

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error
  
  # Build and push single-arch Docker images to ghcr.io
  create-s6-overlay-images:
    name: Docker push s6-overlay - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64",  s6_platform: "x86_64" }
          - { name: "arm64v8", docker_platform: "linux/arm64",  s6_platform: "aarch64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7", s6_platform: "armhf" }
#          - { name: "i386",    docker_platform: "linux/386",    s6_platform: "i686" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod -v a+x docker/rootfs/usr/bin/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}-s6

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          # Test builds (tags with -rc, e.g. 1.1.17-4-rc1) never move :latest or the major tag
          L=${{ env.LATEST_TAG }}
          if [[ "$T" == *-rc* ]]; then
            M=$T
            L=$T
          fi
          echo "LATEST_T=$L" >> $GITHUB_ENV
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      - name: Check API image
        run: |
          case "${{ env.API_IMAGE }}" in
            ghcr.io/mrmarkus42/rustdesk-api:*) ;;
            *) echo "API image must be ghcr.io/mrmarkus42/rustdesk-api:<tag>"; exit 1 ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "./docker"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
            API_IMAGE=${{ env.API_IMAGE }}
          tags: |
            ${{ env.IMAGE_REPO }}-s6:${{ env.LATEST_T }}-${{ matrix.job.name }}
            ${{ env.IMAGE_REPO }}-s6:${{ env.GIT_TAG }}-${{ matrix.job.name }}
            ${{ env.IMAGE_REPO }}-s6:${{ env.MAJOR_TAG }}-${{ matrix.job.name }}
          labels: ${{ steps.meta.outputs.labels }}

  # Set up minifest and tag for pushed image
  create-s6-overlay-images-manifest:
    name: Manifest for s6-overlay images
    needs: create-s6-overlay-images
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          # Test builds (tags with -rc, e.g. 1.1.17-4-rc1) never move :latest or the major tag
          L=${{ env.LATEST_TAG }}
          if [[ "$T" == *-rc* ]]; then
            M=$T
            L=$T
          fi
          echo "LATEST_T=$L" >> $GITHUB_ENV
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      # Create and push manifest for :ve.rs.ion tag
      - name: Create and push manifest (:ve.rs.ion)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}-s6:${{ env.GIT_TAG }} \
            ${{ env.IMAGE_REPO }}-s6:${{ env.GIT_TAG }}-amd64 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.GIT_TAG }}-arm64v8 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.GIT_TAG }}-armv7

      # Create and push manifest for :major tag
      - name: Create and push manifest (:major)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}-s6:${{ env.MAJOR_TAG }} \
            ${{ env.IMAGE_REPO }}-s6:${{ env.MAJOR_TAG }}-amd64 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.MAJOR_TAG }}-arm64v8 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.MAJOR_TAG }}-armv7

      # Create and push manifest for :latest tag
      - name: Create and push manifest (:latest)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}-s6:${{ env.LATEST_T }} \
            ${{ env.IMAGE_REPO }}-s6:${{ env.LATEST_T }}-amd64 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.LATEST_T }}-arm64v8 \
            ${{ env.IMAGE_REPO }}-s6:${{ env.LATEST_T }}-armv7

  # Build and push single-arch Docker images to ghcr.io
  create-classic-images:
    name: Docker push classic - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64" }
          - { name: "arm64v8", docker_platform: "linux/arm64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7" }
          - { name: "i386",    docker_platform: "linux/386" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-linux-${{ matrix.job.name }}
          path: docker-classic
          merge-multiple: true

      - name: Make binaries executable
        run: chmod -v a+x docker-classic/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          # Test builds (tags with -rc, e.g. 1.1.17-4-rc1) never move :latest or the major tag
          L=${{ env.LATEST_TAG }}
          if [[ "$T" == *-rc* ]]; then
            M=$T
            L=$T
          fi
          echo "LATEST_T=$L" >> $GITHUB_ENV
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "./docker-classic"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }}-${{ matrix.job.name }}
            ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }}-${{ matrix.job.name }}
            ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }}-${{ matrix.job.name }}
          labels: ${{ steps.meta.outputs.labels }}

  # Set up minifest and tag for pushed image
  create-classic-images-manifest:
    name: Manifest for classic images
    needs: create-classic-images
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          # Test builds (tags with -rc, e.g. 1.1.17-4-rc1) never move :latest or the major tag
          L=${{ env.LATEST_TAG }}
          if [[ "$T" == *-rc* ]]; then
            M=$T
            L=$T
          fi
          echo "LATEST_T=$L" >> $GITHUB_ENV
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      # Create and push manifest for :ve.rs.ion tag
      - name: Create and push manifest (:ve.rs.ion)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }} \
            ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }}-amd64 \
            ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }}-arm64v8 \
            ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }}-armv7 \
            ${{ env.IMAGE_REPO }}:${{ env.GIT_TAG }}-i386

      # Create and push manifest for :major tag
      - name: Create and push manifest (:major)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }} \
            ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }}-amd64 \
            ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }}-arm64v8 \
            ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }}-armv7 \
            ${{ env.IMAGE_REPO }}:${{ env.MAJOR_TAG }}-i386

      # Create and push manifest for :latest tag
      - name: Create and push manifest (:latest)
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }} \
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }}-amd64 \
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }}-arm64v8 \
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }}-armv7 \
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_T }}-i386
